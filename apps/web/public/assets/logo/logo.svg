<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041632"/>
      <stop offset="100%" stop-color="#1b2b48"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9eaff"/>
      <stop offset="100%" stop-color="#28657a"/>
    </linearGradient>
  </defs>

  <!-- Shield body -->
  <path
    d="M256 28 L462 120 C462 120 472 320 256 484 C40 320 50 120 50 120 Z"
    fill="url(#shieldGrad)"
    stroke="#1b2b48"
    stroke-width="4"
  />

  <!-- Inner shield highlight -->
  <path
    d="M256 60 L432 140 C432 140 440 310 256 452 C72 310 80 140 80 140 Z"
    fill="none"
    stroke="#28657a"
    stroke-width="2"
    opacity="0.3"
  />

  <!-- Vault keyhole circle -->
  <circle cx="256" cy="220" r="72" fill="none" stroke="url(#accentGrad)" stroke-width="6"/>

  <!-- Keyhole shape -->
  <path
    d="M256 190 C240 190 228 202 228 218 C228 230 236 240 248 244 L242 290 C242 294 245 298 250 298 L262 298 C267 298 270 294 270 290 L264 244 C276 240 284 230 284 218 C284 202 272 190 256 190Z"
    fill="url(#accentGrad)"
  />

  <!-- Continuity arcs (left) -->
  <path
    d="M148 180 C148 180 130 250 160 330"
    fill="none"
    stroke="#b9eaff"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.4"
  />

  <!-- Continuity arcs (right) -->
  <path
    d="M364 180 C364 180 382 250 352 330"
    fill="none"
    stroke="#b9eaff"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.4"
  />

  <!-- Top diamond accent -->
  <rect
    x="248" y="100" width="16" height="16"
    rx="2"
    transform="rotate(45 256 108)"
    fill="#b9eaff"
    opacity="0.8"
  />
</svg>
