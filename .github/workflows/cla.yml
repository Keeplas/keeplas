name: CLA Assistant

# Requires a repo secret `CLA_SIGNATURES_TOKEN`: a Personal Access Token with
# `repo` scope, used to commit contributors' signatures to signatures/cla.json.
# Contributors sign by commenting the sentence in `path-to-document` on their PR.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Keeplas/keeplas/blob/main/CONTRIBUTOR_LICENSE_AGREEMENT.md
          # Signatures are stored on a dedicated UNPROTECTED branch — the bot
          # pushes directly here and cannot push to protected main/develop.
          branch: cla-signatures
          allowlist: dependabot[bot], GhislainMitahi, princenocode
