name: CLA Assistant

# Contributors sign by commenting the sentence in `path-to-document` on their PR.
# Signatures are committed to signatures/cla.json on the `cla-signatures`
# branch with the workflow's GITHUB_TOKEN. No personal access token is needed:
# the action only uses PERSONAL_ACCESS_TOKEN when signatures are stored in a
# remote repository/organization, which is not the case here.
#
# Runs on pull_request_target (base-repo context, secrets available) — never
# check out or execute PR code in this workflow.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    runs-on: ubuntu-latest
    permissions:
      actions: write # re-run the CLA check after a contributor signs
      contents: write # commit signatures to the cla-signatures branch
      pull-requests: write # comment on / lock the PR
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Keeplas/keeplas/blob/main/CONTRIBUTOR_LICENSE_AGREEMENT.md
          # Signatures are stored on a dedicated UNPROTECTED branch — the bot
          # pushes directly here and cannot push to protected main/develop.
          branch: cla-signatures
          allowlist: dependabot[bot], GhislainMitahi, princenocode
