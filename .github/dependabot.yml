version: 2
updates:
  # pnpm workspace (npm ecosystem) — root manifest covers the monorepo
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch routine updates into a single PR to cut review noise
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
